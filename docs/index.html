/* Layout: casco de nautiloide no topo (cena desenhada), abas como marcadores de diário, páginas orgânicas de membrana; tema claro = diário de campanha em papel com lacre. */
:root{
  --bg:#F1E7D3;--page:#FBF5E8;--sunk:#E8DCC3;--rim:#CDBB98;--ink:#2A2019;--soft:#6E5E4C;
  --glow:#1E6E66;--flesh:#B0434F;--copper:#8E5A2B;--wax:#9E2B25;--ok:#2F7A55;--maybe:#A0640E;--bad:#A8322F;
  --r-h:#B8811A;--r-m:#1E7D74;--r-v:#5E7A1E;--r-r:#3E62B0;--r-d:#9E1F2C;
  --bgimg:radial-gradient(900px 420px at 85% -10%,rgba(158,43,37,.07),transparent 60%),radial-gradient(700px 400px at 5% 105%,rgba(30,110,102,.08),transparent 60%);
  --membrane:inset 0 0 0 1px var(--rim);
  --f-logo:"Grenze Gotisch","UnifrakturCook",Georgia,serif;--f-head:"IM Fell English SC","IM Fell English",Georgia,serif;--f-ital:"IM Fell English",Georgia,serif;
  --f-body:"Literata",Georgia,serif;--f-num:"Space Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#081012;--page:#0F1A1D;--sunk:#152427;--rim:#244046;--ink:#EADFC9;--soft:#94A7A6;
  --glow:#46E0C9;--flesh:#EF7C8E;--copper:#D19656;--wax:#E0564B;--ok:#58D6A6;--maybe:#F0B455;--bad:#F06F6F;
  --r-h:#F2C35A;--r-m:#46E0C9;--r-v:#A8CF4E;--r-r:#8DB0FF;--r-d:#F0505F;
  --bgimg:radial-gradient(900px 460px at 85% -10%,rgba(239,124,142,.13),transparent 60%),radial-gradient(800px 480px at 0% 110%,rgba(70,224,201,.10),transparent 60%);
  --membrane:inset 0 0 0 1px var(--rim),inset 0 0 24px rgba(70,224,201,.05);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#081012;--page:#0F1A1D;--sunk:#152427;--rim:#244046;--ink:#EADFC9;--soft:#94A7A6;
  --glow:#46E0C9;--flesh:#EF7C8E;--copper:#D19656;--wax:#E0564B;--ok:#58D6A6;--maybe:#F0B455;--bad:#F06F6F;
  --r-h:#F2C35A;--r-m:#46E0C9;--r-v:#A8CF4E;--r-r:#8DB0FF;--r-d:#F0505F;
  --bgimg:radial-gradient(900px 460px at 85% -10%,rgba(239,124,142,.13),transparent 60%),radial-gradient(800px 480px at 0% 110%,rgba(70,224,201,.10),transparent 60%);
  --membrane:inset 0 0 0 1px var(--rim),inset 0 0 24px rgba(70,224,201,.05);
  color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bgimg),var(--bg);background-attachment:fixed;color:var(--ink);font:16.5px/1.6 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--page)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--page);box-shadow:0 1px 0 var(--rim),0 6px 18px rgba(0,0,0,.18)}
.top{display:flex;align-items:center;gap:12px;padding-block:10px 4px}
.logo{width:38px;height:38px;flex:none}
.brand{line-height:1}
.brand b{font:800 1.7rem/1 var(--f-logo);letter-spacing:.01em;color:var(--ink)}
.brand b em{font-style:normal;color:var(--flesh)}
.brand small{display:block;font:italic .82rem var(--f-ital);color:var(--soft);margin-top:3px}
.sync{margin-left:auto;font:.68rem var(--f-num);color:var(--soft);text-align:right}
nav{display:flex;gap:4px;overflow-x:auto;padding-block:6px 0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{font:1rem var(--f-head);background:var(--sunk);border:0;color:var(--soft);padding:7px 14px 6px;border-radius:10px 10px 0 0;cursor:pointer;white-space:nowrap;position:relative;top:1px;box-shadow:inset 0 0 0 1px var(--rim)}
nav button[aria-selected="true"]{background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rim),inset 0 -3px 0 var(--flesh)}
nav button svg{width:15px;height:15px;vertical-align:-2px;margin-right:6px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
main{padding-block:22px 64px}
[role=tabpanel]{display:flex;flex-direction:column;gap:20px}
h2{font:400 1.75rem/1.15 var(--f-head);margin:0;text-wrap:balance;color:var(--ink);display:flex;align-items:center;gap:12px}
h2 svg{width:42px;height:18px;flex:none;stroke:var(--flesh);fill:none;stroke-width:1.6;stroke-linecap:round}
h3{font:400 1.2rem var(--f-head);margin:0;text-wrap:balance}
p{margin:0}
.lede{color:var(--soft);max-width:70ch;font-style:italic;font-family:var(--f-ital);font-size:1.05rem}
.label,th{font:700 .66rem var(--f-num);letter-spacing:.16em;text-transform:uppercase;color:var(--copper)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.page{background:var(--page);border-radius:22px 6px 22px 6px;padding:18px;box-shadow:var(--membrane),0 2px 10px rgba(0,0,0,.10);position:relative}
.note{border-left:4px solid var(--wax);border-radius:4px 18px 18px 4px}
.note b{color:var(--ink)}
.seal{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 4px;border-radius:12px;background:radial-gradient(circle at 35% 35%,#d65a4e,#9E2B25);color:#fff;font:700 .66rem var(--f-num);margin-right:8px;vertical-align:-5px;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.swim{height:10px;border-radius:10px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--rim);position:relative}
.swim>i{position:absolute;left:0;top:0;bottom:0;border-radius:10px;background:linear-gradient(90deg,var(--flesh),var(--glow));min-width:10px}
.swim>i::after{content:"";position:absolute;right:-3px;top:-3px;width:16px;height:16px;border-radius:50% 40% 40% 50%;background:var(--flesh);box-shadow:0 0 10px var(--flesh)}
.ap{display:inline-flex;align-items:center;gap:5px;font:700 .64rem var(--f-num);letter-spacing:.06em;text-transform:uppercase;padding:3px 9px 3px 5px;border-radius:20px;white-space:nowrap}
.ap::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor}
.ap.ok{color:var(--ok);background:rgba(88,214,166,.13)}
.ap.cond{color:var(--maybe);background:rgba(240,180,85,.13)}
.ap.no{color:var(--bad);background:rgba(240,111,111,.13)}
.ap.you{color:var(--glow);background:rgba(70,224,201,.13);box-shadow:inset 0 0 0 1px var(--glow)}
.pcbar{border-left:4px solid var(--em);border-radius:4px 18px 18px 4px}
.orig{display:flex;flex-direction:column;gap:10px}
.orig ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:.92rem}
.orig li b{color:var(--bad)}
.orig.on{box-shadow:var(--membrane),0 0 0 2px var(--em),0 0 22px -6px var(--em)}
.port{display:inline-grid;place-items:center;flex:none;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#1d3034,#081012 75%);box-shadow:0 0 0 2px var(--page),0 0 0 3.5px var(--em),0 0 14px -2px var(--em)}
.port svg{width:24px;height:24px;fill:none;stroke:var(--em);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.port.sm{width:22px;height:22px;box-shadow:0 0 0 1.5px var(--em)}
.port.sm svg{width:13px;height:13px;stroke-width:2.1}
.routes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.route{display:flex;flex-direction:column;gap:9px;border-top:4px solid var(--rc)}
.route .h{display:flex;gap:10px;align-items:center}
.route .h b{font:400 1.25rem var(--f-head)}
.route .camp{font:.66rem var(--f-num);color:var(--soft);letter-spacing:.06em;text-transform:uppercase}
.route .cnt{font:700 2rem/1 var(--f-num);color:var(--rc)}
.route p{font-size:.93rem;color:var(--soft)}
.die{display:inline-grid;place-items:center;width:28px;height:32px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--rc);color:var(--page);font:700 .78rem var(--f-num)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px dashed var(--rim);vertical-align:middle}
th{border-bottom:1.5px solid var(--copper)}
.mx td.c{text-align:center;min-width:96px}
.ap.dot{padding:5px}.ap.dot::before{width:10px;height:10px}
.mx.compact td.c{min-width:44px}
.who{display:flex;align-items:center;gap:9px;white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:.95rem var(--f-head);border:0;background:var(--sunk);color:var(--ink);border-radius:20px;padding:6px 14px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;box-shadow:inset 0 0 0 1px var(--rim)}
.chip i{width:9px;height:11px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--rc,var(--soft))}
.chip[aria-pressed="true"]{background:var(--page);box-shadow:inset 0 0 0 1.5px var(--rc,var(--glow)),0 0 12px -4px var(--rc,var(--glow))}
details.act{padding:0}
details.act>summary{list-style:none;cursor:pointer;padding:15px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
details.act>summary::-webkit-details-marker{display:none}
details.act>summary h3{font-size:1.35rem}
details.act>summary .sp{margin-left:auto;display:flex;gap:10px;align-items:center;color:var(--soft);font-size:.85rem}
.chev{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--flesh);transition:transform .2s}
details.act[open] .chev{transform:rotate(90deg)}
.steps{border-top:1px dashed var(--rim)}
.step{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;padding:14px 18px;border-bottom:1px dashed var(--rim)}
.step:last-child{border-bottom:0}
.step.done .st-title{color:var(--soft);text-decoration:line-through;text-decoration-color:var(--flesh)}
.step.kind-save{background:linear-gradient(90deg,rgba(70,224,201,.08),transparent 70%)}
.st-head{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:baseline}
.st-title{font-weight:600}
.st-body{color:var(--soft);font-size:.95rem;margin-top:3px;max-width:80ch}
.st-body b{color:var(--ink);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font:.82rem var(--f-head);padding:1px 9px;border-radius:12px;color:var(--rc,var(--ink));box-shadow:inset 0 0 0 1px var(--rc,var(--rim))}
.tag.cp{display:inline-flex;gap:5px;align-items:center;padding-left:2px;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rim)}
.roll{display:inline-flex;align-items:center;gap:5px;font:700 .62rem var(--f-num);letter-spacing:.1em;text-transform:uppercase;padding:2px 8px 2px 3px;border-radius:4px;color:#fff}
.roll::before{content:"";width:12px;height:13px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:rgba(255,255,255,.85)}
.roll.missable{background:var(--bad)}.roll.choice{background:var(--maybe);color:#1c1206}.roll.choice::before{background:#1c1206}.roll.save{background:var(--glow);color:#06201c}.roll.save::before{background:#06201c}
.roll.exploit{background:var(--copper)}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:22px;height:25px;margin:2px 3px 0;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--rim);cursor:pointer;position:relative;flex:none;transition:background .15s}
input[type=checkbox]::after{content:"";position:absolute;inset:2px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--sunk)}
input[type=checkbox]:checked{background:var(--glow)}
input[type=checkbox]:checked::after{background:radial-gradient(circle,var(--glow) 0 35%,var(--page) 36%)}
.notebtn{font:italic .85rem var(--f-ital);background:none;border:0;color:var(--glow);cursor:pointer;padding:0;margin-top:7px}
select,textarea{font:.95rem var(--f-body);background:var(--sunk);color:var(--ink);border:0;box-shadow:inset 0 0 0 1px var(--rim);border-radius:8px;padding:7px 9px}
textarea{width:100%;min-height:60px;resize:vertical;margin-top:6px}
.comps{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.comp{display:flex;flex-direction:column;gap:10px}
.comp::before{content:"";position:absolute;left:0;right:0;top:0;height:80px;border-radius:22px 6px 0 0;background:linear-gradient(180deg,var(--emA),transparent);pointer-events:none}
.comp>*{position:relative}
.comp .h{display:flex;gap:12px;align-items:center}
.comp .h b{font:400 1.4rem var(--f-head);display:block}
.comp .h small{display:block;font:italic .85rem var(--f-ital);color:var(--soft)}
.comp dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:.9rem}
.comp dt{font:700 .62rem var(--f-num);letter-spacing:.12em;color:var(--copper);padding-top:4px;text-transform:uppercase}
.comp dd{margin:0}
.comp details{border-top:1px dashed var(--rim);padding-top:6px}
.comp details>summary{cursor:pointer;display:flex;justify-content:space-between;font:1.02rem var(--f-head);color:var(--flesh);padding:4px 0;list-style:none}
.comp details>summary::-webkit-details-marker{display:none}
.qs{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:9px 0;border-bottom:1px dotted var(--rim);font-size:.9rem}
.qs:last-child{border-bottom:0}
.qs .a{font:.66rem var(--f-num);color:var(--copper);letter-spacing:.06em}
.qs p{color:var(--soft);margin-top:2px}
.qs .pick{margin-top:6px;padding:6px 10px;border-radius:4px 12px 12px 4px;border-left:3px solid var(--rc);background:var(--sunk);color:var(--ink);font-size:.88rem}
.qs .pick b{font:.62rem var(--f-num);letter-spacing:.08em;color:var(--rc);display:block;text-transform:uppercase}
.endcard{padding:10px 12px;border-radius:14px 4px 14px 4px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--rim)}
.endcard b{font:1.05rem var(--f-head)}
.endcard p{font-size:.88rem;color:var(--soft)}
.svtree{overflow-x:auto}
.svtree svg{display:block;min-width:780px}
.branches{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.branch label{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;cursor:pointer;padding:4px 0}
code.sv{font:.76rem var(--f-num);background:#081012;color:#46E0C9;padding:2px 6px;border-radius:4px;box-shadow:inset 0 0 0 1px #244046}
.btn{font:1rem var(--f-head);border:0;color:#081012;background:linear-gradient(180deg,#7FF0DE,#2FB8A4);border-radius:20px;padding:9px 22px;cursor:pointer;box-shadow:0 0 14px -4px #46E0C9}
.btn.ghost{background:var(--sunk);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rim)}
.btn.danger{background:none;color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.hero{position:relative;overflow:hidden;border-radius:26px 6px 26px 6px;min-height:250px;display:flex;align-items:flex-end;padding:24px;background:#050b0d;color:#EADFC9;box-shadow:inset 0 0 0 1px #244046}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero .in{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px;max-width:620px}
.hero .k{font:.7rem var(--f-num);letter-spacing:.34em;text-transform:uppercase;color:#46E0C9}
.hero .t{font:800 clamp(2.2rem,6vw,3.6rem)/.95 var(--f-logo);color:#F3E9D6;text-shadow:0 0 24px rgba(239,124,142,.45),0 2px 0 #000}
.hero .t em{font-style:normal;color:#EF7C8E}
.hero p{color:#CFC6B4;max-width:54ch;font:italic 1.05rem var(--f-ital);text-shadow:0 1px 6px #000}
.party{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.slot{display:flex;flex-direction:column;gap:6px}
.slot .role{font:.64rem var(--f-num);letter-spacing:.14em;text-transform:uppercase;color:var(--copper)}
.slot b{font:1.15rem var(--f-head);display:flex;gap:9px;align-items:center}
.slot p{font-size:.9rem;color:var(--soft)}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}body{font-size:16px}.brand b{font-size:1.45rem}.comps{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

html{-webkit-tap-highlight-color:transparent}
body{font-size:16.5px;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header.ab{position:sticky;top:0;z-index:20;background:var(--page);box-shadow:0 1px 0 var(--rim);display:flex;align-items:center;gap:12px;min-height:58px;padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
header.ab img{width:34px;height:34px;border-radius:9px}
header.ab h1{font:400 1.35rem var(--f-head);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.ab .sync{margin:0;font-size:.62rem;max-width:90px}
main.anm{padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--page);box-shadow:0 -1px 0 var(--rim);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav.bn button{background:none;border:0;box-shadow:none;display:flex;flex-direction:column;align-items:center;gap:3px;font:.76rem var(--f-head);color:var(--soft);min-height:58px;padding:0;border-radius:0;top:0}
nav.bn .pi{display:grid;place-items:center;width:58px;height:32px;border-radius:16px}
nav.bn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;margin:0}
nav.bn button[aria-selected="true"]{color:var(--ink)}
nav.bn button[aria-selected="true"] .pi{background:var(--sunk);box-shadow:inset 0 0 0 1px var(--flesh),0 0 12px -4px var(--flesh)}
.morelist{display:flex;flex-direction:column;overflow:hidden}
.morerow{display:flex;align-items:center;gap:14px;min-height:68px;background:none;border:0;border-bottom:1px dashed var(--rim);padding:10px 4px;text-align:left;color:var(--ink);font:1.15rem var(--f-head);width:100%;cursor:pointer}
.morerow:last-child{border-bottom:0}.morerow:active{background:var(--sunk)}

document.addEventListener("change",e=>{const t=e.target;
